name: Publish v1.0.5
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          本次更新尝试减少预设对部分剧情行为与结果的过于严苛的判断，让玩家明确写出的剧情事实更自然地进入正文。

          - 调整两份预设对玩家已明确写入剧情的行为和结果的处理方式，减少无依据的否定、跳过或重新裁定。
          - 将动作是否发生与 NPC 对动作的反应分开处理，继续依据人物卡、世界书、既有关系与当前情境演绎角色。
          - 保留原有提示词槽位、启用状态与 Tavo 导入结构。

          本次属于提示词层面的调整；实际表现可能因模型、服务商、人物卡、世界书和上下文而异。
          EOF

      - name: Create v1.0.5 Release with ZIP attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 1.0.5.zip --title "v1.0.5" --notes-file release-notes.md

name: Publish v1.0.6
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          优化小说正文接续：不再遗漏玩家已写出的心理活动、感受、猜测和打算。

          保留主观判断与客观事实的区别，并允许玩家输入自然分布于开头段落。
          EOF

      - name: Create v1.0.6 Release with ZIP attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.6 1.0.6.zip --title "v1.0.6" --notes-file release-notes.md
